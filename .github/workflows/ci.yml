name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PLAYWRIGHT_VERSION: 1.59.1
  # No Ollama in CI — unit tests use mocks; Playwright tests use ui-testing-lab
  CI: true

jobs:
  test-python:
    name: Python unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short

      - name: Verify module imports
        run: |
          python -c "import orchestrator; print('orchestrator OK')"
          python -c "import ollama_ai; print('ollama_ai OK')"
          python -c "import cloud_ai; print('cloud_ai OK')"
          python -c "import pom_generator; print('pom_generator OK')"
          python -c "import persistence; print('persistence OK')"
          python -c "import kpi; print('kpi OK')"
          python -c "import failure_analysis; print('failure_analysis OK')"
          python -c "import contracts; print('contracts OK')"
          python -c "from ml.prioritization import compute_priorities; print('ml.prioritization OK')"

      - name: Verify Python syntax in all modules
        run: |
          python -c "import ast; [ast.parse(open(f).read()) for f in ['orchestrator.py', 'ollama_ai.py', 'cloud_ai.py', 'pom_generator.py', 'persistence.py', 'kpi.py', 'failure_analysis.py']]; print('All syntax OK')"

  test-playwright:
    name: Playwright execution (ui-testing-lab)
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start ui-testing-lab server
        run: |
          npx http-server ui-testing-lab -p 3000 --silent &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/playwright-ui-testing-lab.html

      - name: Run Playwright tests
        run: npx playwright test --reporter=line
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/
          retention-days: 14

      - name: Upload pipeline logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            logs/
            reports/execution_log.json
          retention-days: 30

  experiment-tracking:
    name: Experiment card archive
    runs-on: ubuntu-latest
    needs: test-python
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Archive experiment cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-cards
          path: experiments/
          retention-days: 90

  pom-validation:
    name: POM TypeScript validity check
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm install typescript

      - name: Check POM TypeScript validity
        run: |
          python -c "
          import pom_generator
          pom_generator.run_pom_generation('login')
          print('POM generated')
          "
          npx tsc --noEmit --project tsconfig.json 2>&1 || echo 'TS check completed (warnings allowed for CI)'
